{% load static %}
{% for post in posts %}
<div class="single-recent-blog-post item">
    <div class="thumb">
        {% if post.image %}
        <img class="img-fluid" src="{{ post.image.url }}" alt="{{ post.title }}">
        {% else %}
        <img class="img-fluid" src="{% static 'img/b1.jpg' %}" alt="Default Image">
        {% endif %}
    </div>

    <div class="details">
        <div class="tags">
            <ul>

                {% for cat in post.category.all %}
                <li>
                    <a href="{% url 'blog:category' cat_name=cat.name %}">{{ cat.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>

        <a href="{% url 'blog:single' pid=post.id %}">
            <h4 class="title">{{ post.title }}</h4>
        </a>

        <p>
            {{ post.content|truncatewords:15 }}
        </p>

        <h6 class="date">{{ post.created_at|date:"d M Y" }}</h6>
    </div>
</div>
{% endfor %}
